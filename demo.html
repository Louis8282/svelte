<style>
:root{
  --ground:#F6F7F3; --surface:#FFFFFF; --surface-2:#EFF2EB; --surface-3:#E6EBE0;
  --ink:#171A14; --ink-2:#454B41; --muted:#6E7568;
  --line:#DEE3D8; --line-2:#C6CEBE;
  --accent:#2E6B4F; --accent-ink:#20503B; --accent-soft:#E2EDE6; --on-accent:#FFFFFF;
  --amber:#9A6606; --clay:#A6402A;
  --shadow:0 1px 2px rgba(23,26,20,.05),0 10px 30px -14px rgba(23,26,20,.2);
  --ui:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E110C; --surface:#1A1E17; --surface-2:#212619; --surface-3:#2A3122;
  --ink:#E9EBE4; --ink-2:#B6BCAF; --muted:#8A917F;
  --line:#2C332A; --line-2:#3D463A;
  --accent:#74C295; --accent-ink:#9BD6B3; --accent-soft:#1E2C24; --on-accent:#10150F;
  --amber:#D9A441; --clay:#DB8266;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#0E110C; --surface:#1A1E17; --surface-2:#212619; --surface-3:#2A3122;
  --ink:#E9EBE4; --ink-2:#B6BCAF; --muted:#8A917F;
  --line:#2C332A; --line-2:#3D463A;
  --accent:#74C295; --accent-ink:#9BD6B3; --accent-soft:#1E2C24; --on-accent:#10150F;
  --amber:#D9A441; --clay:#DB8266;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--ui);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- device frame ---------- */
#frame{
  width:min(400px,100vw);height:min(840px,100%);
  background:var(--surface);display:flex;flex-direction:column;
  overflow:hidden;position:relative;
}
@media (min-width:460px) and (min-height:700px){
  #frame{border:1px solid var(--line-2);border-radius:30px;box-shadow:var(--shadow);height:min(840px,94vh)}
}
#scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px;background:var(--ground)}
#scroll::-webkit-scrollbar{width:0}

/* ---------- shared ---------- */
.head{padding:14px 2px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.head .day{font-size:.68rem;color:var(--muted);font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.head h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.lab{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:2px 2px 8px}
.ic{display:grid;place-items:center;border-radius:9px;background:var(--accent-soft);flex:none;color:var(--accent)}
.ic svg{width:60%;height:60%;display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.empty{text-align:center;color:var(--muted);font-size:.82rem;padding:26px 12px;line-height:1.6}

/* ---------- date navigation ---------- */
.datenav{display:flex;align-items:center;gap:6px;padding:12px 0 12px}
.dn{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.dn svg{width:15px;height:15px}
.dn.off{opacity:.3}
.dnlab{flex:1;text-align:center;min-width:0}
.dnlab b{display:block;font-size:1.22rem;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.dnlab span{display:block;font-size:.62rem;color:var(--muted);letter-spacing:.03em;margin-top:1px}

/* ---------- charts ---------- */
.chart{padding:14px 14px 10px;margin-bottom:11px}
.chart .ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.chart .ch b{font-size:.73rem;font-weight:700}
.chart .ch span{font-family:var(--mono);font-size:.63rem;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .cx{font-family:var(--mono);font-size:7.5px;fill:var(--muted)}

/* ---------- form ---------- */
.frow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow label{flex:1;font-size:.72rem;font-weight:600}
.frow input{width:92px;flex:none;background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;font:inherit;font-family:var(--mono);font-size:.76rem;
  color:var(--ink);outline:none;text-align:right}
.frow input:focus{border-color:var(--accent)}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.tips{padding:11px 13px;font-size:.63rem;color:var(--muted);line-height:1.65}
.tips b{color:var(--ink-2);display:block;margin-bottom:4px;font-size:.66rem}
.tips li{margin-bottom:3px}
.tips ul{margin:0;padding-left:15px}
.priv{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;font-size:.62rem;
  color:var(--muted);line-height:1.6}
.priv svg{width:14px;height:14px;flex:none;color:var(--accent);margin-top:1px}

/* ---------- today ---------- */
.today{display:flex;align-items:center;gap:15px;padding:15px 16px;margin-bottom:11px}
.ring{width:72px;height:72px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring .rc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.15}
.ring .rc b{font-family:var(--mono);font-size:.9rem;font-weight:600}
.ring .rc span{font-size:.52rem;color:var(--muted);letter-spacing:.03em}
.tot{flex:1;min-width:0}
.tot .big{font-family:var(--mono);font-size:1.2rem;font-weight:600;letter-spacing:-.025em}
.tot .big i{font-style:normal;color:var(--muted);font-size:.66rem;font-weight:400}
.tot .sub{font-size:.64rem;color:var(--muted);margin-top:1px}
.macros{display:flex;gap:11px;margin-top:10px}
.macro{flex:1}
.macro .mb{height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-bottom:4px}
.macro .mf{height:100%;border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.macro .ml{font-family:var(--mono);font-size:.57rem;color:var(--muted);display:flex;justify-content:space-between}

/* ---------- recents ---------- */
.recents{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 5px;text-align:center;min-width:0;transition:transform .12s,border-color .12s}
.rec:active{transform:scale(.95);border-color:var(--accent)}
.rec .pic{margin:0 auto 5px;display:grid;place-items:center}
.rec .nm{font-size:.57rem;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .kc{font-family:var(--mono);font-size:.55rem;color:var(--muted);margin-top:1px}

/* ---------- meals ---------- */
.meal{margin-bottom:12px}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 3px 6px}
.meal-h .mn{font-size:.73rem;font-weight:700}
.meal-h .mk{font-family:var(--mono);font-size:.65rem;color:var(--muted)}
.items{overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--line);width:100%}
.row:last-child{border-bottom:0}
.row .pic{display:grid;place-items:center;flex:none}
.row .pic svg{display:block}
.pic.big{display:grid;place-items:center;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:.69rem;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx span{font-size:.59rem;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .kc{font-family:var(--mono);font-size:.67rem;color:var(--ink-2);flex:none}
.row .del{color:var(--muted);font-size:1.1rem;line-height:1;padding:0 2px;flex:none}
.row.tap:active{background:var(--surface-2)}
.addrow{display:flex;align-items:center;gap:8px;padding:9px 11px;color:var(--accent);font-size:.67rem;font-weight:600;width:100%}

/* ---------- steps ---------- */
.stepcard{padding:12px 14px;display:flex;align-items:center;gap:13px;margin-bottom:12px}
.stepcard .sv{font-family:var(--mono);font-size:1.05rem;font-weight:600;letter-spacing:-.02em}
.stepcard .sl{font-size:.58rem;color:var(--muted)}
.spark{flex:1;display:flex;align-items:flex-end;gap:3px;height:28px}
.spark i{flex:1;background:var(--accent-soft);border-radius:2px}
.spark i.on{background:var(--accent)}

/* ---------- search ---------- */
.sfield{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin:2px 0 12px;transition:border-color .15s}
.sfield:focus-within{border-color:var(--accent)}
.sfield svg{width:16px;height:16px;flex:none;color:var(--muted)}
.sfield input{flex:1;border:0;background:none;outline:none;font:inherit;font-size:.82rem;font-weight:500;padding:11px 0;color:var(--ink);min-width:0}
.sfield input::placeholder{color:var(--muted);font-weight:400}
.sfield .clr{color:var(--muted);font-size:1.1rem;padding:0 2px}

.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 8px 11px;text-align:center;transition:transform .12s,border-color .12s}
.cat:active{transform:scale(.96);border-color:var(--accent)}
.cat .pic{margin:0 auto 7px;display:grid;place-items:center}
.cat .nm{font-size:.63rem;font-weight:600;line-height:1.25}
.cat .ct{font-family:var(--mono);font-size:.55rem;color:var(--muted);margin-top:2px}

.subchips{display:flex;gap:6px;overflow-x:auto;padding:0 0 11px;margin:0 -16px 0;padding-inline:16px;scrollbar-width:none}
.subchips::-webkit-scrollbar{display:none}
.chip{font-size:.62rem;font-weight:600;padding:6px 11px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;flex:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.crumb{display:flex;align-items:center;gap:7px;padding:2px 2px 11px;font-size:.72rem;color:var(--muted);font-weight:600}
.crumb b{color:var(--ink);font-weight:700}
.crumb svg{width:14px;height:14px;flex:none}
/* provenance badge: CIQUAL's "préemballé" means nothing to a person, so we say
   "du commerce" / "fast-food" / "fait maison" instead. The distinction matters:
   a fast-food cheeseburger and a homemade one are not the same food. */
.pv{font-style:normal;font-family:var(--mono);font-size:.54rem;font-weight:600;
  letter-spacing:.03em;padding:1px 5px;border-radius:3px;background:var(--surface-2);
  color:var(--muted);vertical-align:1px;white-space:nowrap}
.morebtn{display:block;width:100%;text-align:center;padding:11px;margin-top:9px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  font-size:.7rem;font-weight:600;color:var(--accent)}
.morebtn:active{background:var(--surface-2)}
.hint{font-size:.62rem;color:var(--muted);padding:9px 4px 2px;line-height:1.6}
.hint code{font-family:var(--mono);font-size:.95em;background:var(--surface-2);padding:1px 4px;border-radius:3px}

/* ---------- sheet ---------- */
#veil{position:absolute;inset:0;background:rgba(10,14,9,.45);opacity:0;pointer-events:none;transition:opacity .22s;z-index:5}
#veil.on{opacity:1;pointer-events:auto}
#sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:6;
  background:var(--surface);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:14px 16px 18px;
  transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:88%;overflow-y:auto;
}
#sheet.on{transform:translateY(0)}
.grab{width:34px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 13px}
.fhero{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.fhero .pic{margin-right:2px}
.fhero h2{margin:0;font-size:.92rem;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.fhero .src{font-family:var(--mono);font-size:.58rem;color:var(--muted);margin-top:4px}
.ports{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:13px}
.port{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;transition:border-color .12s,background .12s}
.port.on{border-color:var(--accent);background:var(--accent-soft)}
.port b{display:block;font-size:.68rem;font-weight:700}
.port span{font-family:var(--mono);font-size:.57rem;color:var(--muted)}
.gramrow{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.gramrow input{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-family:var(--mono);font-size:.78rem;color:var(--ink);outline:none;min-width:0}
.gramrow input:focus{border-color:var(--accent)}
.gramrow label{font-size:.63rem;color:var(--muted);font-weight:600;flex:none}
.result{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.result .rv{font-family:var(--mono);font-size:1.5rem;font-weight:600;letter-spacing:-.03em;line-height:1}
.result .rl{font-size:.59rem;opacity:.85;margin-top:3px}
.result .rm{font-family:var(--mono);font-size:.59rem;opacity:.88;text-align:right;line-height:1.6;flex:none}
.mealpick{display:flex;gap:6px;margin-bottom:13px;flex-wrap:wrap}
.cta{background:var(--ink);color:var(--ground);border-radius:12px;padding:12px;text-align:center;font-size:.76rem;font-weight:700;width:100%;transition:opacity .12s}
.cta:active{opacity:.8}

/* ---------- tabs ---------- */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface);padding:7px 4px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));flex:none}
.tab{flex:1;text-align:center;color:var(--muted);font-size:.55rem;font-weight:600;padding:2px 0}
.tab.on{color:var(--accent)}
.tab svg{display:block;margin:0 auto 3px;width:19px;height:19px}

/* ---------- toast ---------- */
#toast{
  position:absolute;left:16px;right:16px;bottom:74px;z-index:8;
  background:var(--ink);color:var(--ground);border-radius:11px;padding:11px 14px;
  font-size:.72rem;font-weight:600;text-align:center;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s;
}
#toast.on{opacity:1;transform:translateY(0)}
.banner{
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;font-size:.62rem;color:var(--muted);line-height:1.55;margin-bottom:12px;
}
.banner b{color:var(--ink-2)}

// Twemoji bodies live in D.svgs, keyed by icon name. They carry their own colours,
// so unlike the line icons they are NOT tinted - which is the whole point: colour is
// what makes a red tomato distinguishable from a green apple at 42 px.
function temoji(key,px){
  var body=D.svgs&&D.svgs[key];
  if(!body) return svg('dots');
  return '<svg viewBox="0 0 36 36" width="'+px+'" height="'+px+'" aria-hidden="true">'+
         body.replace(/^<svg[^>]*>/,'').replace(/<\/svg>\s*$/,'')+'</svg>';
}
function foodIconKey(i){
  var a=D.aliasIcon&&D.aliasIcon[String(i)];
  if(a) return a;
  var si=D.foods[i][6];
  return (D.subIcon&&D.subIcon[si])||'couverts';
}
function foodPic(i,px){return '<span class="pic" style="width:'+px+'px;height:'+px+'px">'+
  temoji(foodIconKey(i),px)+'</span>';}
function svg(k,cls){

         'stroke-linecap="round" stroke-linejoin="round"'+(cls?' class="'+cls+'"':'')+'>'+
         (I[k]||I.dots)+'</svg>';
}
function icoBox(k,cls){return '<span class="ic '+(cls||'')+'">'+svg(k)+'</span>';}

/* ============ state ============ */
var MEAL_ORDER = ['Petit-déjeuner','Déjeuner','Dîner','Collation'];
function iso(d){
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function blankDay(){return {meals:{'Petit-déjeuner':[],'Déjeuner':[],'Dîner':[],'Collation':[]},w:null,steps:null};}

  profile:null,             // {sex, age, cm, kg, act, aim}
  sheet:null, portion:0, grams:null, mealFor:'Déjeuner',

function day(d){
  d = d || S.date;
  if(!S.days[d]) S.days[d]=blankDay();

}
function load(){
  try{
    var r=JSON.parse(localStorage.getItem('bouchee_v2')||'null');
    if(r&&r.days){
      S.days=r.days; S.recents=r.r||[]; S.goal=r.g||2100;

}

/* ---- goal maths: Mifflin-St Jeor, then ISSN protein ranges ---- */
var ACTS = [['Sédentaire',1.2,'bureau, peu de marche'],
            ['Peu actif',1.375,'marche, 1–2 séances / semaine'],
            ['Actif',1.55,'3–5 séances / semaine'],
            ['Très actif',1.725,'travail physique ou sport quotidien']];
var AIMS = [['Perdre du poids',-500,2.0],
            ['Maintenir un poids constant',0,1.6],
            ['Prendre du muscle',300,1.8]];

function computeGoals(p){
  var bmr = 10*p.kg + 6.25*p.cm - 5*p.age + (p.sex==='h'?5:-161);
  var tdee = bmr * ACTS[p.act][1];
  var kcal = Math.round((tdee + AIMS[p.aim][1])/10)*10;
  // never hand someone a dangerous target
  var floor = p.sex==='h'?1500:1200;
  kcal = Math.max(floor, kcal);
  // protein per kg — but above BMI 30, total body weight overshoots badly,
  // so use an adjusted weight or the target becomes unreachable.
  var m = p.cm/100, bmi = p.kg/(m*m), base = p.kg;
  if(bmi > 30){ var ideal = 25*m*m; base = ideal + 0.4*(p.kg - ideal); }
  return {kcal:kcal, prot:Math.round(AIMS[p.aim][2]*base/5)*5,
          tdee:Math.round(tdee), bmi:bmi, adjusted:bmi>30};
}

/* ============ search ============ */
function norm(s){
  return (s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'')
         .toLowerCase().replace(/[^a-z0-9 ]+/g,' ').trim();
}
var ALIAS = {};
D.aliases.forEach(function(a){a.w.forEach(function(w){if(!ALIAS[w])ALIAS[w]=a;});});

function portionsFor(idx){
  for(var i=0;i<D.aliases.length;i++) if(D.aliases[i].i===idx) return D.aliases[i].p;
  return null;
}

function search(raw){
  var q=norm(raw); if(!q) return [];
  var toks=q.split(' ').filter(Boolean);
  var out=[],seen={};

  // 1. alias layer wins outright — this is the hand-curated map of what people type
  Object.keys(ALIAS).forEach(function(w){
    var sc=0;
    if(w===q) sc=10000; else if(w.indexOf(q)===0) sc=9000-(w.length-q.length)*10;
    else if(q.indexOf(w)===0&&w.length>3) sc=7000;
    if(sc){var a=ALIAS[w];if(!seen[a.i]||seen[a.i]<sc){seen[a.i]=sc;}}
  });

  // 2. token-boundary match over every CIQUAL name
  for(var i=0;i<D.foods.length;i++){
    var f=D.foods[i]; if(f[2]==null) continue;
    var words=f[1].split(' '),ok=true,sc=100;
    for(var t=0;t<toks.length;t++){
      var hit=false;
      for(var w2=0;w2<words.length;w2++){
        if(words[w2].indexOf(toks[t])===0){
          hit=true; if(w2===0) sc+=40; if(words[w2]===toks[t]) sc+=25; break;
        }
      }
      if(!hit){ok=false;break;}
    }
    if(!ok) continue;
    if(f[0].indexOf('aliment moyen')>-1) sc+=35;
    sc -= f[0].length*0.25;
    sc -= (f[0].split(',').length-1)*4;
    // Nobody logs raw chicken. Raw flesh sinks below everything cooked; it stays
    // reachable (tartare, sushi, carpaccio are real) but never greets you first.
    if(f[11]) sc -= 400;
    if(seen[i]) sc=Math.max(sc,seen[i]);
    seen[i]=sc;
  }
  Object.keys(seen).forEach(function(k){out.push([parseInt(k,10),seen[k]]);});
  out.sort(function(a,b){return b[1]-a[1];});
  return out.slice(0,60);
}

/* ============ totals ============ */
function totals(d){
  var t={kcal:0,p:0,c:0,f:0,n:0},M=(d?day(d):day()).meals;
  MEAL_ORDER.forEach(function(m){
    (M[m]||[]).forEach(function(e){
      t.kcal+=e.kcal; t.p+=e.p; t.c+=e.c; t.f+=e.f; t.n++;
    });
  });
  return t;
}
function mealKcal(m){
  return (meals()[m]||[]).reduce(function(s,e){return s+e.kcal;},0);
}
function hasData(d){
  var t=totals(d); return t.n>0 || S.days[d]&&S.days[d].w;
}
function iconForFood(i){
  var f=D.foods[i],s=D.subs[f[6]];
  return s?s[1]:'dots';
}
function subOf(i){return D.subs[D.foods[i][6]];}
function unitOf(i){var s=subOf(i);return (s&&s[4])?'ml':'g';}
// "(aliment moyen)" is CIQUAL's phrase for a population average. It means nothing to
// a person logging lunch, so it never reaches the screen.
function dispName(i){
  var n=D.foods[i][0];
  // CIQUAL names are database keys. "Beurre ou assimilé sans précision sur la teneur
  // en matière grasse, doux" is butter. Strip the bookkeeping before it reaches anyone.
  n=n.replace(/\s*\(aliment moyen\)\s*/g,' ');
  n=n.replace(/,?\s*sans pr[ée]cision[^,]*/gi,'');
  n=n.replace(/,?\s*tout type de[^,]*/gi,'');
  n=n.replace(/,?\s*pr[ée]lev[ée]e? [àa][^,]*/gi,'');
  n=n.replace(/\s*\(ex\s*:[^)]*\)/gi,'');
  n=n.replace(/\s+/g,' ').replace(/\s*,\s*$/,'').trim();
  return n||D.foods[i][0];
}
function provOf(i){return D.foods[i][13]||'';}
function aliasLabel(i){
  for(var a=0;a<D.aliases.length;a++) if(D.aliases[a].i===i) return D.aliases[a].d;
  return null;
}
var fmt=function(n){return Math.round(n).toLocaleString('fr-FR');};
function today(){
  try{
    return new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  }catch(e){ return ''; }
}

/* ============ render ============ */
var scroll=document.getElementById('scroll');

function render(){
  if(S.tab==='journal') scroll.innerHTML=viewJournal();
  else if(S.tab==='chercher') scroll.innerHTML=viewSearch();
  else scroll.innerHTML=viewSuivi();
  renderTabs();
  wire();
}

function renderTabs(){
  var t=[['journal','book','Journal'],['chercher','search','Chercher'],['suivi','chart','Suivi']];
  document.getElementById('tabs').innerHTML=t.map(function(x){
    return '<button class="tab'+(S.tab===x[0]?' on':'')+'" data-tab="'+x[0]+'">'+svg(x[1])+x[2]+'</button>';
  }).join('');
}

function viewJournal(){
  var t=totals(),pct=Math.min(1,t.kcal/S.goal),C=2*Math.PI*29;
  var isToday = S.date===iso(new Date());
  var h='<div class="datenav">'+
        '<button class="dn" data-shift="-1" aria-label="Jour précédent">'+svg('back')+'</button>'+
        '<button class="dnlab" id="opendays"><b>'+(isToday?'Aujourd\'hui':dayLabel(S.date))+'</b>'+
        '<span>'+longDate(S.date)+'</span></button>'+
        '<button class="dn'+(isToday?' off':'')+'" data-shift="1" aria-label="Jour suivant"'+
        (isToday?' disabled':'')+'>'+svg('fwd')+'</button></div>';

  h+='<div class="card today"><div class="ring"><svg width="72" height="72" viewBox="0 0 72 72">'+
     '<circle cx="36" cy="36" r="29" fill="none" stroke="var(--surface-2)" stroke-width="7"/>'+
     '<circle cx="36" cy="36" r="29" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"'+
     ' stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-pct)).toFixed(1)+'"/></svg>'+
     '<div class="rc"><div><b>'+fmt(Math.max(0,S.goal-t.kcal))+'</b><span>restant</span></div></div></div>'+
     '<div class="tot"><div class="big">'+fmt(t.kcal)+' <i>/ '+fmt(S.goal)+' kcal</i></div>'+
     '<div class="sub">'+(t.n?t.n+' aliment'+(t.n>1?'s':'')+' enregistré'+(t.n>1?'s':''):'rien encore — commencez quand vous voulez')+'</div>'+
     '<div class="macros">'+
       mb('Prot',t.p,S.protGoal||110,'var(--accent)',S.protGoal)+
       mb('Gluc',t.c,260,'var(--amber)')+mb('Lip',t.f,80,'var(--clay)')+
     '</div></div></div>';

  if(S.recents.length){
    h+='<div class="lab">Récents — un appui</div><div class="recents">';
    h+=S.recents.slice(0,4).map(function(r){
      var f=D.foods[r.i];
      return '<button class="rec" data-quick="'+r.i+'">'+foodPic(r.i,26)+
             '<div class="nm">'+esc(r.d)+'</div><div class="kc">'+Math.round(r.kcal)+'</div></button>';
    }).join('');
    h+='</div>';
  } else {
    h+='<div class="banner">Aucun réglage, aucun compte, aucune question. '+
       '<b>Tapez sur Chercher et enregistrez votre premier aliment.</b> '+
       'Les aliments fréquents apparaîtront ici pour un enregistrement en un appui.</div>';
  }

  MEAL_ORDER.forEach(function(m){
    var items=meals()[m]||[];
    h+='<div class="meal"><div class="meal-h"><span class="mn">'+m+'</span>'+
       '<span class="mk">'+(items.length?fmt(mealKcal(m))+' kcal':'—')+'</span></div><div class="card items">';
    items.forEach(function(e,ix){
      h+='<div class="row">'+foodPic(e.i,30)+
         '<div class="tx"><b>'+esc(e.d)+'</b><span>'+esc(e.plabel)+' · '+e.g+' '+(e.u||'g')+'</span></div>'+

    });

  });

  var st=stepsFor(S.date);

     (isToday?'aujourd\'hui':'ce jour-là')+'</div></div>'+
     '<div class="spark">'+stepWeek(S.date).map(function(v,i){
       return '<i class="'+(i===6?'on':'')+'" style="height:'+Math.max(12,v/140).toFixed(0)+'%"></i>';
     }).join('')+'</div></div>';
  h+='<div class="hint">Les pas sont simulés dans ce prototype — un navigateur ne lit pas le capteur du téléphone. '+
     'À vérifier en premier sur le Fairphone 4.</div>';
  h+='<div style="height:14px"></div>';
  return h;
}
function mb(lab,v,max,col,goal){
  var done = goal && v>=goal;
  return '<div class="macro"><div class="mb"><div class="mf" style="width:'+
         Math.min(100,v/max*100).toFixed(0)+'%;background:'+col+'"></div></div>'+
         '<div class="ml"><span>'+lab+(done?' ✓':'')+'</span><span>'+Math.round(v)+
         (goal?' / '+goal:'')+' g</span></div></div>';
}
function dayLabel(d){
  var t=new Date(), y=new Date(t.getTime()-864e5);
  if(d===iso(y)) return 'Hier';
  try{
    return cap(new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long'}));
  }catch(e){ return d; }
}
function longDate(d){
  try{
    return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  }catch(e){ return d; }
}
// Simulated, but deterministic per date, so browsing back through the journal
// shows a stable history instead of numbers that change on every re-render.
function stepsFor(k){
  var rec=S.days[k];
  if(rec && rec.steps!=null) return rec.steps;
  var h=0; for(var i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))>>>0;
  var wd=new Date(k+'T12:00:00').getDay();
  var base=(wd===0||wd===6)?9200:7100;
  return base + (h%4200) - 1200;
}
function stepWeek(k){
  var out=[],dt=new Date(k+'T12:00:00');
  for(var i=6;i>=0;i--){
    var d=new Date(dt.getTime()-i*864e5);
    out.push(stepsFor(iso(d)));
  }
  return out;
}
function shiftDate(n){
  var dt=new Date(S.date+'T12:00:00');
  dt.setDate(dt.getDate()+n);
  if(iso(dt) > iso(new Date())) return;
  S.date=iso(dt);
}

     'autocomplete="off" autocorrect="off" spellcheck="false">'+
     (S.q?'<button class="clr" id="clr" aria-label="Effacer">×</button>':'')+'</div>';

  if(S.q.trim()){

      'Essayez un mot plus simple — <i>pain</i> plutôt que <i>baguette tradition</i>.</div>';
    h+='<div class="lab">'+res.length+' résultat'+(res.length>1?'s':'')+'</div><div class="card items">';
    h+=res.map(function(r){return foodRow(r[0]);}).join('');

  }

  /* ---- level 1: the ten categories ---- */
  if(S.cat===null){
    h+='<div class="lab">Parcourir</div><div class="cats">';
    D.cats.forEach(function(c,i){
      h+='<button class="cat" data-cat="'+i+'"><span class="pic big">'+temoji((D.catIcon&&D.catIcon[i])||'couverts',44)+'</span>'+
         '<div class="nm">'+esc(c[0])+'</div></button>';
    });
    h+='</div><div class="hint">Ou tapez ce que vous cherchez — tout fonctionne hors ligne.</div>';
    return h;
  }

  var cat=D.cats[S.cat];

  /* ---- level 2: sub-categories, as icons, never a wall of food ---- */
  // one sub-category means the middle screen would show a single tile, so skip it
  if(S.sub===null && cat[2].length===1){ S.sub=cat[2][0]; }
  if(S.sub===null){
    h+='<button class="crumb" id="back">'+svg('back')+' <b>'+esc(cat[0])+'</b></button>';
    h+='<div class="cats">';
    cat[2].forEach(function(si){
      var n=0;
      for(var k=0;k<D.vg.length;k++) if(D.vg[k][1]===si&&!D.vg[k][3]) n++;
      if(!n) return;
      h+='<button class="cat" data-sub="'+si+'"><span class="pic big">'+temoji((D.subIcon&&D.subIcon[si])||'couverts',44)+'</span>'+
         '<div class="nm">'+esc(D.subs[si][0])+'</div><div class="ct">'+n+'</div></button>';
    });
    h+='</div>';
    return h;
  }

  /* ---- level 3: the foods themselves, everyday ones first ---- */
  h+='<button class="crumb" id="back">'+svg('back')+' <b>'+esc(D.subs[S.sub][0])+'</b>'+
     '<span style="font-weight:500">· '+esc(cat[0])+'</span></button>';
  var list=[];
  for(var k=0;k<D.vg.length;k++){
    var vgr=D.vg[k];
    if(vgr[1]!==S.sub||vgr[3]) continue;
    if(D.foods[vgr[2][0]][2]==null) continue;
    list.push(k);
  }
  // a tomato is botanically a fruit and culinarily a vegetable; it appears in both
  var extra=(D.alsoIn&&D.alsoIn[String(S.sub)])||[];
  extra.forEach(function(k){ if(list.indexOf(k)<0) list.push(k); });
  list.sort(function(a,b){
    var A=D.vg[a],B=D.vg[b];
    if(A[4]!==B[4]) return B[4]-A[4];               // everyday foods to the top
    return A[0].localeCompare(B[0],'fr');
  });
  var CUT=24, shown=S.showAll?list.length:Math.min(CUT,list.length);
  var nCommon=list.filter(function(k){return D.vg[k][4];}).length;
  if(nCommon){
    var head=list.slice(0,Math.min(nCommon,shown));
    var tail=list.slice(Math.min(nCommon,shown),shown);
    h+='<div class="lab">Les plus courants</div>';
    h+='<div class="card items">'+head.map(groupRow).join('')+'</div>';

      h+='<div class="lab">Tout le reste, de A à Z</div>';
      h+='<div class="card items">'+tail.map(groupRow).join('')+'</div>';
    }
  } else {
    h+='<div class="card items">'+list.slice(0,shown).map(groupRow).join('')+'</div>';
  }
  if(list.length>shown)
    h+='<button class="morebtn" id="more">Voir les '+(list.length-shown)+' autres</button>';
  h+='<div style="height:14px"></div>';
  return h;
}

function series(kind,n){
  var out=[],t=new Date();
  for(var i=n-1;i>=0;i--){
    var d=new Date(t.getTime()-i*864e5),k=iso(d);
    var rec=S.days[k];
    if(kind==='w') out.push([k, rec&&rec.w?rec.w:null]);
    else { var tt=rec?totals(k):null; out.push([k, tt&&tt.n?(kind==='kcal'?tt.kcal:tt.p):null]); }
  }
  return out;
}
function lineChart(pts,col,unit,goal){
  var vals=pts.filter(function(p){return p[1]!=null;});
  if(vals.length<2) return '<div class="empty" style="padding:16px">Pas encore assez de données.<br>'+
    'Quelques jours suffisent pour voir une tendance.</div>';
  var W=300,H=78,P=4;
  var ys=vals.map(function(p){return p[1];});
  var lo=Math.min.apply(null,ys),hi=Math.max.apply(null,ys);
  if(goal){lo=Math.min(lo,goal);hi=Math.max(hi,goal);}
  if(hi-lo<1e-6){hi=lo+1;}
  var pad=(hi-lo)*0.15; lo-=pad; hi+=pad;
  var X=function(i){return P+i*(W-2*P)/(pts.length-1);};
  var Y=function(v){return H-P-(v-lo)/(hi-lo)*(H-2*P);};
  var d='',started=false;
  pts.forEach(function(p,i){
    if(p[1]==null) return;
    d+=(started?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)+' '; started=true;
  });
  var last=null;
  for(var i=pts.length-1;i>=0;i--) if(pts[i][1]!=null){last=[i,pts[i][1]];break;}
  var g='';
  if(goal) g='<line x1="'+P+'" y1="'+Y(goal).toFixed(1)+'" x2="'+(W-P)+'" y2="'+Y(goal).toFixed(1)+
    '" stroke="var(--line-2)" stroke-width="1" stroke-dasharray="3 3"/>';
  return '<svg viewBox="0 0 '+W+' '+(H+13)+'" role="img">'+g+
    '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
    (last?'<circle cx="'+X(last[0]).toFixed(1)+'" cy="'+Y(last[1]).toFixed(1)+'" r="3.2" fill="'+col+'"/>':'')+
    '<text class="cx" x="'+P+'" y="'+(H+10)+'">'+shortDate(pts[0][0])+'</text>'+
    '<text class="cx" x="'+(W-P)+'" y="'+(H+10)+'" text-anchor="end">'+shortDate(pts[pts.length-1][0])+'</text>'+
    '<text class="cx" x="'+(W-P)+'" y="'+(Y(hi-pad)+3).toFixed(1)+'" text-anchor="end">'+
      Math.round(hi-pad)+unit+'</text>'+
    '</svg>';
}
function shortDate(k){
  try{return new Date(k+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
  catch(e){return k;}
}

function openSheet(i){

  // not hand-curated? fall back to the portions for its sub-category — bowls, slices,

  }

  h+='<div class="card" style="margin-bottom:12px"><div class="priv">'+svg('lock')+
    '<div>Ces informations restent sur votre téléphone et servent uniquement à ce calcul. '+
    'Nous ne les vendons à personne.</div></div></div>';
  h+='<button class="cta" id="qsave"'+(valid?'':' style="opacity:.45"')+'>Enregistrer mes objectifs</button>'+
     '<button class="chip" id="qskip" style="margin-top:9px;width:100%;text-align:center">Passer</button>';

  showSheet(h,function(){
    q$('[data-sex]').forEach(function(b){b.onclick=function(){S.draft.sex=b.dataset.sex;drawQuiz();};});
    q$('[data-act]').forEach(function(b){b.onclick=function(){S.draft.act=+b.dataset.act;drawQuiz();};});
    q$('[data-aim]').forEach(function(b){b.onclick=function(){S.draft.aim=+b.dataset.aim;drawQuiz();};});
    ['qage','qcm','qkg'].forEach(function(id){
      var el=document.getElementById(id);
      if(el) el.oninput=function(){
        var v=parseFloat(el.value);
        S.draft[id==='qage'?'age':id==='qcm'?'cm':'kg']=isNaN(v)?0:v;
        var gg=null,pp=S.draft;
        if(pp.age>=14&&pp.age<=100&&pp.cm>=120&&pp.cm<=230&&pp.kg>=30&&pp.kg<=400) gg=computeGoals(pp);
        var r=document.querySelector('#sheet .result');
        if(gg&&r) r.innerHTML='<div><div class="rv">'+fmt(gg.kcal)+'</div><div class="rl">kcal par jour</div></div>'+
          '<div class="rm">'+gg.prot+' g<br>de protéines</div>';
      };
    });
    document.getElementById('qsave').onclick=function(){
      var pp=S.draft;
      if(!(pp.age>=14&&pp.age<=100&&pp.cm>=120&&pp.cm<=230&&pp.kg>=30&&pp.kg<=400)){
        toast('Vérifiez l\'âge, la taille et le poids'); return;
      }
      var gg=computeGoals(pp);
      S.profile=pp; S.goal=gg.kcal; S.protGoal=gg.prot;
      if(day().w==null) day().w=pp.kg;
      save(); closeSheet(); toast('Objectifs enregistrés'); render();
    };
    document.getElementById('qskip').onclick=closeSheet;
  });
}
function curGrams(){
  if(S.grams!=null) return S.grams;
  return S.ports[S.portion]?S.ports[S.portion][1]:100;
}
function drawSheet(){
  var i=S.sheet,f=D.foods[i],g=curGrams(),k=g/100;
  var lab=aliasLabel(i),u=unitOf(i),pv=provOf(i);
  var h='<div class="grab"></div>';
  h+='<div class="fhero"><span class="pic big">'+temoji(foodIconKey(i),42)+'</span>'+
     '<div style="flex:1;min-width:0"><h2>'+esc(lab?cap(lab):dispName(i))+
     (pv?' <i class="pv">'+esc(pv)+'</i>':'')+'</h2>'+
     '<div class="src">'+Math.round(f[2])+' kcal / 100 '+u+' · CIQUAL</div>'+
     '</div></div>';
  h+='<div class="lab">Portion</div><div class="ports">';
  h+=S.ports.map(function(p,ix){
    return '<button class="port'+(S.grams==null&&S.portion===ix?' on':'')+'" data-port="'+ix+'">'+
      '<b>'+esc(p[0])+'</b><span>'+p[1]+' '+u+' · '+Math.round(f[2]*p[1]/100)+' kcal</span></button>';
  }).join('')+'</div>';
  h+='<div class="gramrow"><label for="gr">ou en '+(u==='ml'?'millilitres':'grammes')+'</label>'+
     '<input id="gr" type="number" inputmode="numeric" min="1" max="3000" placeholder="'+g+'" '+
     'value="'+(S.grams!=null?S.grams:'')+'"></div>';
  h+='<div class="result"><div><div class="rv">'+Math.round(f[2]*k)+'</div>'+
     '<div class="rl">kcal · '+esc(S.grams!=null?(g+' '+u):S.ports[S.portion][0])+'</div></div>'+
     '<div class="rm">P '+(f[3]*k).toFixed(1)+' g<br>G '+(f[4]*k).toFixed(1)+' g<br>L '+(f[5]*k).toFixed(1)+' g</div></div>';
  h+='<div class="lab">Repas</div><div class="mealpick">'+
     MEAL_ORDER.map(function(m){
       return '<button class="chip'+(S.mealFor===m?' on':'')+'" data-meal="'+m+'">'+m+'</button>';
     }).join('')+'</div>';
  h+='<button class="cta" id="addbtn">Ajouter à '+S.mealFor.toLowerCase()+'</button>';
  document.getElementById('sheet').innerHTML=h;
  document.getElementById('veil').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  wireSheet();
}
function addFood(){
  var i=S.sheet,f=D.foods[i],g=curGrams(),k=g/100,u=unitOf(i);
  var lab=aliasLabel(i);
  var d=lab?cap(lab):dispName(i);
  var entry={i:i,d:d,g:g,u:u,plabel:S.grams!=null?('en '+(u==='ml'?'ml':'g')):S.ports[S.portion][0],
             kcal:f[2]*k,p:f[3]*k,c:f[4]*k,f:f[5]*k};
  var before=totals().p;
  meals()[S.mealFor].push(entry);
  // positive, achievable, once a day — the only nudge that cannot shame anyone
  if(S.protGoal && before < S.protGoal && totals().p >= S.protGoal) S.hitProt=true;
  S.recents=S.recents.filter(function(r){return r.i!==i;});
  S.recents.unshift({i:i,d:d,kcal:entry.kcal,g:g,plabel:entry.plabel});
  S.recents=S.recents.slice(0,8);
  save(); closeSheet();
  if(S.hitProt){ S.hitProt=false; toast('Objectif protéines atteint 💪'); }
  else toast(d+' ajouté — '+Math.round(entry.kcal)+' kcal');
  S.tab='journal'; S.q=''; render();
}
function quickAdd(i){
  var r=null;
  for(var x=0;x<S.recents.length;x++) if(S.recents[x].i===i){r=S.recents[x];break;}
  if(!r) return;
  var f=D.foods[i],k=r.g/100;
  var hour=new Date().getHours();
  var m=hour<11?'Petit-déjeuner':hour<15?'Déjeuner':hour<21?'Dîner':'Collation';
  var before=totals().p;
  meals()[m].push({i:i,d:r.d,g:r.g,plabel:r.plabel,kcal:f[2]*k,p:f[3]*k,c:f[4]*k,f:f[5]*k});
  save();
  if(S.protGoal && before<S.protGoal && totals().p>=S.protGoal) toast('Objectif protéines atteint 💪');
  else toast(r.d+' → '+m.toLowerCase());
  render();
}

/* ============ wiring ============ */
function wire(){
  q$('[data-tab]').forEach(function(b){b.onclick=function(){
    S.tab=b.dataset.tab; if(S.tab!=='chercher'){S.cat=null;S.sub=null;} render();
    scroll.scrollTop=0;
  };});
  q$('[data-food]').forEach(function(b){b.onclick=function(){openSheet(+b.dataset.food);};});
  q$('[data-cat]').forEach(function(b){b.onclick=function(){
    S.cat=+b.dataset.cat;S.sub=null;S.showAll=false;render();scroll.scrollTop=0;};});
  q$('[data-sub]').forEach(function(b){b.onclick=function(){
    S.sub=b.dataset.sub===''?null:+b.dataset.sub; S.showAll=false; render(); scroll.scrollTop=0;};});
  q$('[data-vg]').forEach(function(b){b.onclick=function(){openGroup(+b.dataset.vg);};});
  var mo=document.getElementById('more');
  if(mo) mo.onclick=function(){S.showAll=true;render();};
  q$('[data-quick]').forEach(function(b){b.onclick=function(){quickAdd(+b.dataset.quick);};});
  q$('[data-goal]').forEach(function(b){b.onclick=function(){S.goal=+b.dataset.goal;save();render();};});
  q$('[data-del]').forEach(function(b){b.onclick=function(e){
    e.stopPropagation();
    var p=b.dataset.del.split('|'); meals()[p[0]].splice(+p[1],1); save(); render();};});
  q$('[data-add]').forEach(function(b){b.onclick=function(){
    S.mealFor=b.dataset.add; S.tab='chercher'; S.q=''; S.cat=null; S.sub=null; render();
    var el=document.getElementById('q'); if(el) el.focus();};});
  var bk=document.getElementById('back');
  if(bk) bk.onclick=function(){
    if(S.sub!==null){S.sub=null;} else {S.cat=null;}
    S.showAll=false; render(); scroll.scrollTop=0; };
  q$('[data-shift]').forEach(function(b){b.onclick=function(){
    shiftDate(+b.dataset.shift); render(); scroll.scrollTop=0;};});
  var wi=document.getElementById('weighin'); if(wi) wi.onclick=openWeigh;
  var qz=document.getElementById('quiz');    if(qz) qz.onclick=openQuiz;
  var od=document.getElementById('opendays');
  if(od) od.onclick=function(){ S.date=iso(new Date()); render(); scroll.scrollTop=0; };
  var qi=document.getElementById('q');
  if(qi){
    qi.oninput=function(){
      S.q=qi.value; var pos=qi.selectionStart;
      var res=S.q.trim()?search(S.q):null;
      redrawResults(res);
    };
    if(S.focusQ){qi.focus();S.focusQ=false;}
  }
  var cl=document.getElementById('clr');
  if(cl) cl.onclick=function(){S.q='';S.focusQ=true;render();};
  document.getElementById('veil').onclick=closeSheet;
}
function redrawResults(res){
  // keep the input alive (and focused) while results update underneath it
  var holder=scroll.querySelector('.card.items'),labs=scroll.querySelectorAll('.lab'),
      hints=scroll.querySelectorAll('.hint'),cats=scroll.querySelector('.cats'),
      crumb=document.getElementById('back'),chips=scroll.querySelector('.subchips'),
      empty=scroll.querySelector('.empty');
  if(res===null){ S.focusQ=true; render(); return; }
  if(cats||crumb||chips||empty){ render(); var e=document.getElementById('q'); if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);} return; }
  if(!holder){ render(); var e2=document.getElementById('q'); if(e2){e2.focus();} return; }
  hints.forEach(function(x){x.remove();});
  if(labs[0]) labs[0].textContent=res.length+' résultat'+(res.length>1?'s':'');
  holder.innerHTML=res.map(function(r){return foodRow(r[0]);}).join('');
  holder.insertAdjacentHTML('afterend',searchHint());
  q$('[data-food]').forEach(function(b){b.onclick=function(){openSheet(+b.dataset.food);};});
}
function wireSheet(){
  q$('[data-port]',document.getElementById('sheet')).forEach(function(b){
    b.onclick=function(){S.portion=+b.dataset.port;S.grams=null;drawSheet();};});
  q$('[data-meal]',document.getElementById('sheet')).forEach(function(b){
    b.onclick=function(){S.mealFor=b.dataset.meal;drawSheet();};});
  var gr=document.getElementById('gr');
  if(gr) gr.oninput=function(){
    var v=parseInt(gr.value,10);
    S.grams=(isNaN(v)||v<=0)?null:Math.min(3000,v);
    var f=D.foods[S.sheet],g=curGrams(),k=g/100,r=document.querySelector('#sheet .result');
    if(r) r.innerHTML='<div><div class="rv">'+Math.round(f[2]*k)+'</div><div class="rl">kcal · '+
      (S.grams!=null?g+' g':esc(S.ports[S.portion][0]))+'</div></div>'+
      '<div class="rm">P '+(f[3]*k).toFixed(1)+' g<br>G '+(f[4]*k).toFixed(1)+' g<br>L '+(f[5]*k).toFixed(1)+' g</div>';
    q$('[data-port]',document.getElementById('sheet')).forEach(function(b){b.classList.remove('on');});
  };
  var ab=document.getElementById('addbtn');
  if(ab) ab.onclick=addFood;
}

/* ============ utils ============ */
function q$(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
var tt;
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(function(){el.classList.remove('on');},1900);
}

load(); render();
})();
</script>
